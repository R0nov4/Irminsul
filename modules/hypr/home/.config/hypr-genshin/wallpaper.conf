# ✦ تنظیمات موتور والپیپر Genshin — این فایل bash هست، هر چی خواستی عوض کن

AUTO_MODE="off"            # off | rotate | daily | daynight   (یا: wallpaper.sh --mode daily)
ROTATE_MINUTES=30          # فقط برای rotate
DAY_START=6                # daynight: روز از ۶ تا ۱۸ (پوشه‌های day/ و night/ توی wallpapers/)
NIGHT_START=18

TRANSITION="grow"          # grow (دایره از مرکز) | outer | wipe | wave | fade | center | any | random
TRANSITION_DURATION="1.6"
TRANSITION_FPS=60
TRANSITION_POS="center"
TRANSITION_BEZIER=".43,1.19,1,.4"
RESIZE="crop"              # crop | fit | no
FILTER="Lanczos3"

SHOW_RARITY=1              # ستاره‌ی ۳/۴/۵ برای هر عکس (ثابت، از اسم فایل)
NOTIFY=1
SOUND=""                   # مسیر یه .ogg/.wav اگه خواستی موقع تغییر والپیپر پخش بشه

