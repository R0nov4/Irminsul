general {
    border_size = 2
    gaps_in = 6
    gaps_out = 12
    col.active_border = rgba(f4e8c1ff) rgba(d3bc8eff) rgba(7ec8ffaa) rgba(f4e8c1ff) 45deg
    col.inactive_border = rgba(3b4255cc) rgba(262b39cc) 45deg
}

decoration {
    rounding = 14
    blur {
        enabled = true
        size = 6
        passes = 3
    }
    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(0d1018cc)
    }
}

animations {
    enabled = true
    bezier = teyvatSnap, 0.16, 1.0, 0.3, 1.0
    bezier = teyvatSoft, 0.25, 1.0, 0.5, 1.0
    animation = windows, 1, 4, teyvatSnap, popin 82%
    animation = windowsOut, 1, 4, teyvatSoft, popin 85%
    animation = windowsMove, 1, 4, teyvatSnap, slide
    animation = border, 1, 6, default
    animation = borderangle, 1, 90, teyvatSoft, loop
    animation = fade, 1, 4, teyvatSoft
    animation = workspaces, 1, 5, teyvatSnap, slidefade 18%
}

env = XCURSOR_THEME,Genshin-Official
env = XCURSOR_SIZE,32
env = HYPRCURSOR_THEME,Genshin-Official
env = HYPRCURSOR_SIZE,32
exec = hyprctl setcursor Genshin-Official 32
