# Genshin Impact - Start Screen

general {
    hide_cursor = false
    ignore_empty_input = true
}

# عکس بدون بلور و بدون تیره شدن اضافه، مثل خود بازی
background {
    monitor =
    path = __BG__
    blur_passes = 0
    brightness = 1.0
    contrast = 1.0
    vignette = 0.25
    noise = 0.0
}

# ── لوگو، بالا وسط ──
# LOGO_BEGIN
image {
    monitor =
    path = __LOGO__
    size = 760
    rounding = 0
    border_size = 0
    position = 0, 130
    halign = center
    valign = center
}
# LOGO_END

# LOGOTXT_BEGIN
label {
    monitor =
    text = <span letter_spacing="4000">GENSHIN</span>
    color = rgba(255, 255, 255, 1.0)
    font_size = 84
    font_family = HYWenHei
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(30, 40, 90, 0.7)
    position = 0, 190
    halign = center
    valign = center
}
label {
    monitor =
    text = <span letter_spacing="9000">IMPACT</span>
    color = rgba(244, 232, 193, 1.0)
    font_size = 40
    font_family = HYWenHei
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(30, 40, 90, 0.7)
    position = 0, 105
    halign = center
    valign = center
}
# LOGOTXT_END

# ── گوشه‌ی بالا چپ: ساعت و تاریخ، کوچک و ساده ──
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 30
    font_family = HYWenHei
    shadow_passes = 3
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 34, -26
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] LC_ALL=C date '+%A, %d %B'
    color = rgba(255, 255, 255, 0.85)
    font_size = 14
    font_family = HYWenHei
    shadow_passes = 3
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 36, -72
    halign = left
    valign = top
}

# ── گوشه‌ی بالا راست: باتری ──
label {
    monitor =
    text = cmd[update:30000] ~/.config/hyprlock-genshin/battery.sh
    color = rgba(255, 255, 255, 0.9)
    font_size = 16
    font_family = HYWenHei
    shadow_passes = 3
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    position = -34, -70
    halign = right
    valign = top
}

# ── قرص «سرور» بالای نوار شروع ──
# SHAPE_BEGIN
shape {
    monitor =
    size = 200, 40
    color = rgba(0, 0, 0, 0.28)
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.50)
    position = 0, 158
    halign = center
    valign = bottom
}
# SHAPE_END

label {
    monitor =
    text =   ▾
    color = rgba(255, 255, 255, 0.95)
    font_size = 14
    font_family = HYWenHei
    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, 167
    halign = center
    valign = bottom
}

# ── نوار «Click to Start» که اینجا فیلد رمزه ──
input-field {
    monitor =
    size = 440, 54
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.40
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.60)
    inner_color = rgba(0, 0, 0, 0.38)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(244, 232, 193, 1.0)
    fail_color = rgba(255, 120, 100, 1.0)
    capslock_color = rgba(244, 211, 94, 1.0)
    fade_on_empty = false
    rounding = -1
    font_family = HYWenHei
    placeholder_text = <span letter_spacing="2500">Enter Password to Start</span>
    fail_text = <span letter_spacing="1500">$FAIL</span>  ($ATTEMPTS)
    position = 0, 82
    halign = center
    valign = bottom
}

# ── گوشه‌های پایین ──
label {
    monitor =
    text = Ver. 1.0  ·  Arch Linux
    color = rgba(255, 255, 255, 0.75)
    font_size = 13
    font_family = HYWenHei
    shadow_passes = 3
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 30, 22
    halign = left
    valign = bottom
}

label {
    monitor =
    text = UID: 800370495
    color = rgba(255, 255, 255, 0.75)
    font_size = 13
    font_family = HYWenHei
    shadow_passes = 3
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    position = -30, 22
    halign = right
    valign = bottom
}

# ── زبان کیبورد، بالا راست ──
label {
    monitor =
    text = ⌨  $LAYOUT
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = HYWenHei
    shadow_passes = 3
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    position = -34, -34
    halign = right
    valign = top
}
